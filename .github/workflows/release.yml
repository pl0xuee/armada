name: Release

# Releases are cut only by pushing a version tag (`git tag v1.2.3 && git push --tags`).
# There is deliberately no manual trigger: tagName/releaseName always come from a real
# `v*` tag ref.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is built or signed unless the tag matches the version and the tests pass.
  verify:
    name: Verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for pkg in apps/desktop/package.json apps/remote/package.json; do
            v=$(node -p "require('./$pkg').version")
            if [ "$v" != "$version" ]; then
              echo "::error::$pkg is $v but Cargo.toml is $version"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version $version (expected v$version)"
            exit 1
          fi

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Test mobile companion
        working-directory: apps/remote
        run: |
          npm ci
          npm run build
          npm test

      - name: Type-check desktop UI
        working-directory: apps/desktop
        run: |
          npm ci
          npx tsc --noEmit

      - name: Test
        run: cargo test --workspace

  release:
    name: ${{ matrix.name }}
    needs: verify
    # Repository environment: add required reviewers / tag-protection rules and move the
    # signing secrets here (Settings → Environments → release) to gate every release.
    environment: release
    permissions:
      contents: write # create the draft release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            rust-targets: ""
            args: ""
          - name: Windows
            platform: windows-latest
            rust-targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/remote/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # Separate key: release builds never restore caches written by CI runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The phone app is embedded into the binary (src-tauri/build.rs refuses to build a
      # release without it). beforeBuildCommand rebuilds it; building here fails early.
      - name: Build mobile companion
        working-directory: apps/remote
        run: |
          npm ci
          npm run build

      # Signing secrets are passed to this step only.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # --- macOS code signing + notarization (uncomment once secrets exist) ---
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}               # base64 .p12
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}     # "Developer ID Application: …"
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}                     # app-specific password
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # --- Windows code signing (uncomment once a certificate exists) ---
          # Configure bundle.windows.certificateThumbprint or bundle.windows.signCommand
          # in tauri.conf.json, then provide the certificate here, e.g.:
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}           # base64 .pfx
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

          # --- Auto-updater signing: signs the update bundles and produces latest.json,
          #     which installed copies of Armada check against (see tauri.conf.json). ---
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Armada ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your platform from the assets below.
            - **macOS**: `.dmg` (universal: Apple Silicon + Intel)
            - **Windows**: `-setup.exe`
            - **Linux**: `.AppImage`, `.deb` or `.rpm`
          # Drafts are invisible to the updater: review the draft, then press Publish
          # to roll the update out to everyone.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
