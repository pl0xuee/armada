name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bumping the version needs a CHANGELOG.md section for it (the release notes);
      # catch a missing one here instead of when the tag is pushed.
      - name: Release notes for this version
        if: runner.os == 'Linux'
        run: python3 scripts/release_notes.py --check

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev libclang-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/remote/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Test frontend
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run test --if-present

      # Embedded into the desktop binary by src-tauri/build.rs.
      - name: Build mobile companion
        working-directory: apps/remote
        run: |
          npm ci
          npm run build

      - name: Test mobile companion
        if: runner.os == 'Linux'
        working-directory: apps/remote
        run: npm test

      - name: Formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      # On every OS: there are cfg(windows)/cfg(unix)/cfg(target_os) code paths.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # Catches bundler misconfiguration (targets, deb dependencies, icons, CSP) before a
      # release does. Updater artifacts need the signing key, which CI doesn't have.
      - name: Bundle (deb, debug)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: npm run tauri build -- --ci --debug --bundles deb --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The same check for the macOS app bundle and the Windows installer, which are
      # otherwise first built on a release tag.
      - name: Bundle (app, debug)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: npm run tauri build -- --ci --debug --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Bundle (nsis, debug)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: npm run tauri build -- --ci --debug --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

  # Known-vulnerability check of Cargo.lock against the RustSec advisory database.
  # Fails on vulnerabilities only; unmaintained/yanked notices are warnings.
  audit:
    name: cargo audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Audit
        run: cargo audit
