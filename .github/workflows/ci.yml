name: CI

# One pipeline, the same on every run:
#   1. linux          everything: release notes, command contract, format, phone + desktop
#                     UI tests and builds, clippy, Rust tests
#   2. macOS/Windows  clippy + Rust tests (platform code), after linux passes
#   3. e2e            builds the real app and drives it headless (catches runtime wiring bugs
#                     unit tests can't, e.g. a command whose state was never registered)
#   4. release        only for a version tag (v1.2.3), only if 1-3 passed: builds and signs
#                     the installers into a draft GitHub release
# Changes go straight to main; Dependabot's pull requests run steps 1-3.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main replaces a running check; a release is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    name: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Bumping the version needs a CHANGELOG.md section for it (the release notes).
      - name: Release notes for this version
        run: python3 scripts/release_notes.py --check

      # api.ts invoke() calls vs the #[tauri::command] signatures vs the mock.
      - name: UI and Rust command contract
        run: python3 scripts/check_contract.py

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev libclang-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/remote/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Test and build mobile companion
        working-directory: apps/remote
        run: |
          npm ci
          npm run build
          npm test

      - name: Test and build desktop UI
        working-directory: apps/desktop
        run: |
          npm ci
          npm run test --if-present
          npm run build

      # The Preview page script is committed prebuilt (src-tauri embeds it).
      - name: Preview page script matches its source
        working-directory: apps/desktop
        run: |
          npm run build:preview-agent
          git diff --exit-code -- src-tauri/assets/preview-agent.js || {
            echo "::error::src-tauri/assets/preview-agent.js is stale: run npm run build:preview-agent and commit it"
            exit 1
          }

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  native:
    name: ${{ matrix.name }}
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Rust code only needs the frontend folder to exist to compile and test (debug
      # builds embed a placeholder phone app), so skip npm here.
      - name: Stub frontend dist
        shell: bash
        run: |
          mkdir -p apps/desktop/dist
          echo '<!doctype html><title>Armada</title>' > apps/desktop/dist/index.html

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          shared-key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  e2e:
    name: e2e
    needs: linux
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev libclang-dev patchelf \
            webkit2gtk-driver xvfb dbus-x11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/remote/package-lock.json
            apps/desktop/e2e/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      # Also caches ~/.cargo/bin, so tauri-driver is only compiled on a cold cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the app (debug)
        run: |
          (cd apps/remote && npm ci)
          cd apps/desktop
          npm ci
          npm run tauri build -- --ci --debug --no-bundle

      # Pinned for reproducibility; bump together with apps/desktop/e2e.
      - name: Install tauri-driver
        run: command -v tauri-driver >/dev/null && tauri-driver --version | grep -q 2.1.0 || cargo install tauri-driver --version 2.1.0 --locked

      # Fresh HOME/XDG dirs, Xvfb and a private session bus; see apps/desktop/e2e/run.sh.
      - name: Drive the real app
        timeout-minutes: 10
        working-directory: apps/desktop/e2e
        run: |
          npm ci
          ./run.sh

  release:
    name: release (${{ matrix.name }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, native, e2e]
    # Repository environment: add required reviewers there to approve every release.
    environment: release
    permissions:
      contents: write # create the draft release and upload assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin -- --locked
          - name: Linux
            platform: ubuntu-22.04
            rust-targets: ""
            args: "-- --locked"
          - name: Windows
            platform: windows-latest
            rust-targets: ""
            args: "-- --locked"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches the app version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          for pkg in apps/desktop/package.json apps/remote/package.json; do
            v=$(node -p "require('./$pkg').version")
            if [ "$v" != "$version" ]; then
              echo "::error::$pkg is $v but Cargo.toml is $version"
              exit 1
            fi
          done
          if [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match version $version (expected v$version)"
            exit 1
          fi

      # The tag's CHANGELOG.md section: the GitHub release body and the updater's notes.
      - name: Release notes
        id: notes
        shell: bash
        run: |
          python3 scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "body<<${delim}"
            cat release-notes.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libdbus-1-dev libclang-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/remote/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-targets }}

      # Own key: release builds never restore caches written by check runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: ". -> target"
          key: release-${{ matrix.platform }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # The phone app is embedded into the binary (src-tauri/build.rs refuses to build a
      # release without it).
      - name: Build mobile companion
        working-directory: apps/remote
        run: |
          npm ci
          npm run build

      # Signing secrets are passed to this step only.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization and Windows code signing: add the APPLE_* /
          # WINDOWS_CERTIFICATE* secrets here once certificates exist.
          # Updater signing: signs the update bundles and produces latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Armada ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Drafts are invisible to the updater: review the draft, then press Publish.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
