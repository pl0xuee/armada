version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-patch:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/remote
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      remote-minor-patch:
        update-types: [minor, patch]
