version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      desktop-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /apps/remote
    schedule:
      interval: weekly
    groups:
      remote-minor-patch:
        update-types: [minor, patch]
