name: Feature request
description: An idea for Kvistcode (formerly Armada)
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation or problem first; the solution can come after.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
