[package]
name = "armada-core"
description = "Agent supervisor, protocol clients and storage for Armada"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
parking_lot.workspace = true
which.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# platform-verifier: trust the OS certificate store (corporate TLS-inspecting proxies);
# win-system-proxy: honor the Windows proxy setting (HTTP(S)_PROXY env vars are read anyway).
ureq = { version = "3", features = ["platform-verifier", "win-system-proxy"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "9.1.3", default-features = false, features = ["deflate-flate2"] }
base64 = "0.22"

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
