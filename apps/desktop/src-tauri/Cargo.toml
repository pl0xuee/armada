[package]
name = "armada-desktop"
description = "Armada — agent command center (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "armada"

[[bin]]
name = "armada"
path = "src/main.rs"

[lib]
name = "armada_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
armada-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
parking_lot.workspace = true
which.workspace = true
# Same major version tauri uses for `app_data_dir()`, so the startup PATH setup
# resolves the exact same directory.
dirs = "7"

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rodio = { version = "0.23", default-features = false, features = ["playback", "wav", "vorbis", "mp3", "flac"] }
portable-pty = "0.9"
# Voice dictation: mic capture (same cpal rodio uses) and local speech-to-text
# (whisper.cpp, CPU only; needs cmake + a C++ compiler to build).
cpal = "0.18.2"
whisper-rs = "0.16"
ureq = "3"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
axum = "0.8"
# The remote server's accept loop (connection cap, header-read timeout).
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
qrcode = "0.14"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
# Signals for PTY process groups and polling the PTY.
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
arboard = { version = "3", default-features = false, features = ["wayland-data-control", "image-data"] }
png = "0.18"
# Desktop notifications + their actions over the session bus.
zbus = "6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = "4"
