<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kvistcode</title>
  <defs>
    <!-- gunmetal body -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A454A"/>
      <stop offset="0.18" stop-color="#2C3539"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <!-- brushed sheen across the face -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <!-- machined top edge highlight -->
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.12" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- ice-blue mark -->
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9E4FF"/>
      <stop offset="0.5" stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#2A9FD6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.47" r="0.42">
      <stop offset="0" stop-color="#4FC3F7" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="200" ry="200"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" ry="200" fill="url(#body)"/>
  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="url(#sheen)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glow)"/>
  </g>
  <rect x="68" y="68" width="888" height="888" rx="196" ry="196" fill="none" stroke="url(#edge)" stroke-width="8"/>

  <!-- the K: a stem with two arms branching off it (kvist is Norwegian for twig) -->
  <path d="M6 3H11.5V13.2L22 3H29L16.4 15.6L29.4 29H22.6L12.6 18.6L11.5 19.7V29H6Z" transform="translate(122 160) scale(22)" fill="url(#ice)" stroke="url(#ice)" stroke-width="0.9" stroke-linejoin="round"/>
</svg>
