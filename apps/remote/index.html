<!doctype html>
<html lang="en" data-theme="gunmetal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Armada" />
    <meta name="application-name" content="Armada" />
    <meta name="description" content="Watch your Armada agents, approve requests and send prompts from your phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Armada</title>
    <style>
      #static-fallback { font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #e6eaef; background: #0b0d10; min-height: 100vh; padding: 48px 24px; text-align: center; }
      #static-fallback[hidden] { display: none; }
      #static-fallback h1 { font-size: 22px; margin: 0 0 8px; }
      #static-fallback p { color: #9aa4b2; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Shown instead of the app on browsers too old to run it (see the script below). -->
      <div id="static-fallback" hidden>
        <h1>Please update your browser</h1>
        <p>Armada Remote needs iOS 16.4 or later, or a recent Chrome, Edge or Firefox.</p>
      </div>
    </div>
    <noscript>Armada Remote needs JavaScript enabled.</noscript>
    <script>
      // Browsers older than the build target (iOS < 16.4, …) can't run the app: say so instead of a blank page.
      (function () {
        var ok = window.CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red, blue)") && "noModule" in document.createElement("script");
        if (ok) return;
        // The styles live in the <style> above: the CSP blocks inline style attributes.
        document.addEventListener("DOMContentLoaded", function () {
          var note = document.getElementById("static-fallback");
          if (note) note.hidden = false;
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
