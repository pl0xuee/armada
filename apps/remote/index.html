<!doctype html>
<html lang="en" data-theme="gunmetal">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#0B0D10" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Armada" />
    <meta name="application-name" content="Armada" />
    <meta name="description" content="Watch your Armada agents, approve requests and send prompts from your phone." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <title>Armada</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Armada Remote needs JavaScript enabled.</noscript>
    <script>
      // Browsers older than the build target (iOS < 16.4, …) can't run the app: say so instead of a blank page.
      (function () {
        var ok = window.CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red, blue)") && "noModule" in document.createElement("script");
        if (ok) return;
        document.addEventListener("DOMContentLoaded", function () {
          document.body.innerHTML =
            '<div style="font:16px/1.5 -apple-system,system-ui,sans-serif;color:#E6EAEF;background:#0B0D10;min-height:100vh;padding:48px 24px;text-align:center">' +
            "<h1 style=\"font-size:22px;margin:0 0 8px\">Please update your browser</h1>" +
            '<p style="color:#9AA4B2;margin:0">Armada Remote needs iOS 16.4 or later, or a recent Chrome, Edge or Firefox.</p></div>';
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
