[workspace]
resolver = "2"
members = ["crates/armada-core", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "MIT"
repository = "https://github.com/pl0xuee/armada"

[workspace.dependencies]
armada-core = { path = "crates/armada-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
which = "8"

[profile.release]
lto = true
codegen-units = 1
strip = true
